site_name: Cloudflare Adoption Framework
site_description: >-
  An independent, community-maintained framework for planning, deploying, governing,
  and operating Cloudflare at organizational scale.
site_url: https://kevinevans1.github.io/cloudflare-adoption-framework/
repo_url: https://github.com/kevinevans1/cloudflare-adoption-framework
repo_name: kevinevans1/cloudflare-adoption-framework
edit_uri: edit/main/docs/
copyright: >-
  This is an independent, community-maintained project. It is not produced by,
  affiliated with, endorsed by, or sponsored by Cloudflare, Inc. "Cloudflare" and
  related marks are trademarks of Cloudflare, Inc. All product information is
  sourced from public Cloudflare documentation and linked at point of use.

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - footnotes

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kevinevans1
  generator: false

